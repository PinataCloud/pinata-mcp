name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Protected environment: requires approval, and only main / v* tags can deploy.
    # npm's trusted publisher for `pinata-mcp` only accepts OIDC tokens from this environment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          if npm view "pinata-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "::error::pinata-mcp@$VERSION is already on npm"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # prepublishOnly builds as well; building here fails the job before publishing starts.
      - name: Build
        run: npm run build

      # Pre-releases go to the "next" dist-tag so `npx pinata-mcp` keeps getting the latest stable.
      - name: Publish
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
